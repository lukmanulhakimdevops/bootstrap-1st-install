name: Test Day-0 Bootstrap & Odoo Retail Store POS

on:
  push:
    branches: [main, master]
    paths:
      - 'bootstrap-1st-install.sh'
      - 'ansible-pg-dbaas-swarm-v3.zip'
      - '.github/workflows/test-bootstrap.yml'
  pull_request:
    paths:
      - 'bootstrap-1st-install.sh'
      - 'ansible-pg-dbaas-swarm-v3.zip'
      - '.github/workflows/test-bootstrap.yml'
  workflow_dispatch:

env:
  SCRIPT_PATH: ./bootstrap-1st-install.sh
  ZIP_PATH: ./ansible-pg-dbaas-swarm-v3.zip

jobs:
  # ===========================================================================
  # 1. Static Analysis & CLI Argument Parsing
  # ===========================================================================
  lint-and-cli:
    name: 1. Lint & CLI Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bash syntax & ShellCheck
        run: |
          chmod +x "$SCRIPT_PATH"
          bash -n "$SCRIPT_PATH"
          shellcheck -S warning "$SCRIPT_PATH"

      - name: Test CLI flags (--help, conflicts, unknown options)
        run: |
          set -euo pipefail

          "$SCRIPT_PATH" --help | grep -q "MODE 1: --managed"
          "$SCRIPT_PATH" -h | grep -q "MODE 2: --control"

          if "$SCRIPT_PATH" >/dev/null 2>&1; then
            echo "FAIL: tanpa argumen seharusnya gagal" >&2; exit 1
          fi

          if "$SCRIPT_PATH" --managed --control >/dev/null 2>&1; then
            echo "FAIL: kombinasi --managed --control seharusnya ditolak" >&2; exit 1
          fi

          if "$SCRIPT_PATH" --managed --opsi-ngawur >/dev/null 2>&1; then
            echo "FAIL: opsi tak dikenal seharusnya ditolak" >&2; exit 1
          fi

          echo "CLI checks PASSED"

  # ===========================================================================
  # 2. Unit Test Fungsi Validasi, Topologi, Inventory & Patching YAML
  # ===========================================================================
  unit-tests:
    name: 2. Unit Tests (Validators, Quorum, YAML Patch)
    runs-on: ubuntu-latest
    needs: lint-and-cli
    steps:
      - uses: actions/checkout@v4

      - name: Setup isolated Python venv with PyYAML (PEP 668 safe)
        run: |
          python3 -m venv /tmp/unit-venv
          /tmp/unit-venv/bin/pip install --quiet pyyaml

      - name: Validate every YAML inside ansible-pg-dbaas-swarm-v3.zip (if present)
        run: |
          if [[ -f "$ZIP_PATH" ]]; then
            /tmp/unit-venv/bin/python - "$ZIP_PATH" <<'PY'
          import sys, yaml, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              cnt = 0
              for name in sorted(z.namelist()):
                  if name.endswith((".yml", ".yaml")):
                      yaml.safe_load(z.read(name).decode("utf-8"))
                      cnt += 1
              print(f"PASS: {cnt} YAML files inside {sys.argv[1]} parsed cleanly")
          PY
          fi

      - name: Run unit test suite against sourced functions
        shell: bash
        run: |
          set -Eeuo pipefail
          PY=/tmp/unit-venv/bin/python
          # shellcheck disable=SC1090
          source "$SCRIPT_PATH"
          trap - ERR

          assert_ok() {
            local desc=$1; shift
            if ! ( "$@" ) >/dev/null 2>&1; then
              echo "FAIL (expected OK): $desc" >&2
              exit 1
            fi
            echo "PASS: $desc"
          }

          assert_fail() {
            local desc=$1; shift
            if ( "$@" ) >/dev/null 2>&1; then
              echo "FAIL (expected FAIL): $desc" >&2
              exit 1
            fi
            echo "PASS (rejected): $desc"
          }

          # --- A. Helper validators ---
          assert_ok   "is_ipv4 valid"             is_ipv4 "10.88.0.1"
          assert_fail "is_ipv4 octet > 255"       is_ipv4 "10.88.0.256"
          assert_fail "is_ipv4 non-ip"            is_ipv4 "not.an.ip.addr"
          assert_ok   "is_port valid"             is_port "5432"
          assert_fail "is_port zero"              is_port "0"
          assert_fail "is_port > 65535"           is_port "70000"
          assert_ok   "is_name valid"             is_name "db_node-1"
          assert_fail "is_name uppercase"         is_name "DB1"
          assert_ok   "is_pg_ident valid"         is_pg_ident "odoo_store1"
          assert_fail "is_pg_ident hyphen"        is_pg_ident "odoo-store1"
          assert_ok   "is_placeholder_ip RFC5737" is_placeholder_ip "203.0.113.10"
          assert_fail "is_placeholder_ip RFC1918" is_placeholder_ip "172.28.0.10"
          assert_ok   "is_hostname FQDN"          is_hostname "node-db1.internal.local"
          assert_fail "is_hostname leading dash"  is_hostname "-badhost"
          assert_ok   "version_ge 2.16 >= 2.15"   version_ge "2.16.4" "2.15"
          assert_fail "version_ge 2.14 < 2.15"    version_ge "2.14.9" "2.15"

          # --- B. Validasi topologi & kuorum Raft ---
          export OVPN_PUBLIC_ENDPOINT="vpn.prod.example.internal"
          export BACKUP_SSH_IP="172.28.0.10" BACKUP_VPN_IP="10.88.0.1"
          export MON_SSH_IP="172.28.0.20"    MON_VPN_IP="10.88.0.20"
          export DB_HOSTS="1:db1:172.28.0.11:10.88.0.11:manager:100:yes,2:db2:172.28.0.12:10.88.0.12:manager:90:yes,3:db3:172.28.0.13:10.88.0.13:worker:0:no"
          export STORE_LIST_SPEC="STR01:store1:monitoring:8069:odoo_store1,STR02:store2:monitoring:8070:odoo_store2:custom_usr"

          assert_ok "parse_cluster_specs valid 3 managers" parse_cluster_specs
          assert_ok "validate_control_config valid"        validate_control_config
          assert_ok "check_placeholders clean RFC1918"     bash -c 'source "$SCRIPT_PATH"; trap - ERR; parse_cluster_specs; check_placeholders'

          assert_fail "quorum even rejected" env \
            DB_HOSTS="1:db1:172.28.0.11:10.88.0.11:manager:100:yes,2:db2:172.28.0.12:10.88.0.12:worker:90:yes" \
            ALLOW_BAD_QUORUM=0 \
            bash -c 'source "$SCRIPT_PATH"; trap - ERR; parse_cluster_specs'

          assert_ok "quorum even allowed with ALLOW_BAD_QUORUM=1" env \
            DB_HOSTS="1:db1:172.28.0.11:10.88.0.11:manager:100:yes,2:db2:172.28.0.12:10.88.0.12:worker:90:yes" \
            ALLOW_BAD_QUORUM=1 \
            bash -c 'source "$SCRIPT_PATH"; trap - ERR; parse_cluster_specs'

          assert_fail "DB_HOSTS < 2 node" env \
            DB_HOSTS="1:db1:172.28.0.11:10.88.0.11:manager:100:yes" \
            bash -c 'source "$SCRIPT_PATH"; trap - ERR; parse_cluster_specs'

          assert_fail "DB_HOSTS duplicate VPN IP" env \
            DB_HOSTS="1:db1:172.28.0.11:10.88.0.11:manager:100:yes,2:db2:172.28.0.12:10.88.0.11:manager:90:yes" \
            bash -c 'source "$SCRIPT_PATH"; trap - ERR; parse_cluster_specs'

          assert_fail "DB_HOSTS reserved name backup" env \
            DB_HOSTS="1:backup:172.28.0.11:10.88.0.11:manager:100:yes,2:db2:172.28.0.12:10.88.0.12:manager:90:yes" \
            bash -c 'source "$SCRIPT_PATH"; trap - ERR; parse_cluster_specs'

          assert_fail "STORE_LIST_SPEC host:port collision" env \
            STORE_LIST_SPEC="STR01:store1:monitoring:8069:odoo_store1,STR02:store2:monitoring:8069:odoo_store2" \
            bash -c 'source "$SCRIPT_PATH"; trap - ERR; parse_cluster_specs'

          STORE_COUNT=$(STORE_LIST_SPEC="" bash -c 'source "$SCRIPT_PATH"; trap - ERR; parse_cluster_specs; echo "${#STORE_NAMES[@]}"')
          [[ "$STORE_COUNT" == "0" ]] || { echo "FAIL: STORE_LIST_SPEC kosong seharusnya 0 store, dapat $STORE_COUNT" >&2; exit 1; }
          echo "PASS: STORE_LIST_SPEC='' disables Pola 1"

          # --- C. Placeholder guard ---
          assert_fail "placeholder TEST-NET rejected" env \
            BACKUP_SSH_IP="203.0.113.10" ALLOW_PLACEHOLDER=0 DRY_RUN=0 \
            bash -c 'source "$SCRIPT_PATH"; trap - ERR; parse_cluster_specs; check_placeholders'

          assert_ok "placeholder allowed with ALLOW_PLACEHOLDER=1" env \
            BACKUP_SSH_IP="203.0.113.10" ALLOW_PLACEHOLDER=1 DRY_RUN=0 \
            bash -c 'source "$SCRIPT_PATH"; trap - ERR; parse_cluster_specs; check_placeholders'

          # --- D. Config control validation ---
          assert_fail "relative SSH_KEY_PATH rejected" env SSH_KEY_PATH="relative/id_ed25519" \
            bash -c 'source "$SCRIPT_PATH"; trap - ERR; validate_control_config'

          assert_fail "invalid OVPN_PROTO rejected" env OVPN_PROTO="icmp" \
            bash -c 'source "$SCRIPT_PATH"; trap - ERR; validate_control_config'

          assert_fail "same BACKUP_VPN_IP and MON_VPN_IP" env BACKUP_VPN_IP="10.88.0.1" MON_VPN_IP="10.88.0.1" \
            bash -c 'source "$SCRIPT_PATH"; trap - ERR; validate_control_config'

          # --- E. emit_inventory & patch_group_vars (YAML valid + idempotensi + jaga odoo_image custom) ---
          TMP_TEST=$(mktemp -d)
          trap 'rm -rf "$TMP_TEST"' EXIT

          SSH_USER="ubuntu" parse_cluster_specs
          SSH_USER="ubuntu" emit_inventory > "$TMP_TEST/hosts.yml"
          "$PY" - "$TMP_TEST/hosts.yml" <<'PY'
          import sys, yaml
          data = yaml.safe_load(open(sys.argv[1]))
          assert data["all"]["vars"]["ansible_user"] == "ubuntu"
          assert data["all"]["vars"]["ansible_become"] is True
          dbs = data["all"]["children"]["db_nodes"]["hosts"]
          assert dbs["db1"]["is_primary"] is True
          assert dbs["db2"]["is_primary"] is False
          assert dbs["db3"]["sync_eligible"] is False
          print("PASS: emit_inventory YAML valid & attributes exact")
          PY

          mkdir -p "$TMP_TEST/bak"
          cat > "$TMP_TEST/all.yml" <<'YAML'
          ---
          ovpn_public_endpoint: "old.invalid"
          ovpn_port: 1194
          ovpn_proto: "udp"
          store_nodes:
            - code: "OLD"
              name: "legacy"

          # --- Computed Helper Variables ---
          odoo_image: "{{ registry_prefix }}pg-dbaas-v3-odoo-retail:{{ odoo_version }}"
          YAML

          OVPN_PUBLIC_ENDPOINT="vpn.prod.example.internal" OVPN_PORT="51820" OVPN_PROTO="tcp" \
            patch_group_vars "$TMP_TEST/all.yml" "$TMP_TEST/bak"
          cp "$TMP_TEST/all.yml" "$TMP_TEST/all.run1.yml"

          OVPN_PUBLIC_ENDPOINT="vpn.prod.example.internal" OVPN_PORT="51820" OVPN_PROTO="tcp" \
            patch_group_vars "$TMP_TEST/all.yml" "$TMP_TEST/bak"

          diff -u "$TMP_TEST/all.run1.yml" "$TMP_TEST/all.yml"
          [[ -f "$TMP_TEST/bak/all.yml.orig" ]]
          grep -q "# --- Computed Helper Variables ---" "$TMP_TEST/all.yml"

          "$PY" - "$TMP_TEST/all.yml" <<'PY'
          import sys, yaml
          data = yaml.safe_load(open(sys.argv[1]))
          assert data["ovpn_public_endpoint"] == "vpn.prod.example.internal"
          assert data["ovpn_port"] == 51820
          assert data["ovpn_proto"] == "tcp"
          assert "pg-dbaas-v3-odoo-retail" in data["odoo_image"]
          assert len(data["store_nodes"]) == 2
          assert data["store_nodes"][0]["db_user"] == "odoo_store1"
          assert data["store_nodes"][1]["db_user"] == "custom_usr"
          print("PASS: patch_group_vars YAML valid, idempotent, & preserves custom odoo_image")
          PY

  # ===========================================================================
  # 3. Dry-Run Smoke Test (Non-Root — Guardrail Read-Only)
  # ===========================================================================
  dry-run:
    name: 3. Dry-Run Mode (Managed & Control)
    runs-on: ubuntu-latest
    needs: lint-and-cli
    steps:
      - uses: actions/checkout@v4

      - name: Run --managed --dry-run and --control --dry-run as non-root
        run: |
          set -euo pipefail
          chmod +x "$SCRIPT_PATH"

          ssh-keygen -q -t ed25519 -N "" -f /tmp/dryrun_key

          "$SCRIPT_PATH" --managed --dry-run \
            --hostname node-db1 \
            --pubkey-file /tmp/dryrun_key.pub 2>&1 | tee /tmp/managed-dry.log
          grep -q "\[DRY-RUN\] systemctl enable --now ssh" /tmp/managed-dry.log

          "$SCRIPT_PATH" --control --dry-run --auto-deploy 2>&1 | tee /tmp/control-dry.log
          grep -q "ansible-playbook -i inventory/hosts.yml site.yml" /tmp/control-dry.log

  # ===========================================================================
  # 4. Integration Test: Mode 1 (--managed) di Debian & Ubuntu
  # ===========================================================================
  integration-managed:
    name: 4. Integration --managed (${{ matrix.os }})
    runs-on: ubuntu-latest
    needs: [unit-tests, dry-run]
    strategy:
      fail-fast: false
      matrix:
        os:
          - debian:12
          - ubuntu:22.04
          - ubuntu:24.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare test SSH keypair
        run: ssh-keygen -q -t ed25519 -N "" -C "ci-control@test" -f /tmp/ci_control_ed25519

      - name: Test A — Full --managed (hostname, pubkey, sshd hardening, idempotency)
        run: |
          set -euo pipefail
          chmod +x "$SCRIPT_PATH"

          docker run --rm --cap-add=SYS_ADMIN \
            -v "$PWD/$SCRIPT_PATH:/bootstrap.sh:ro" \
            -v "/tmp/ci_control_ed25519.pub:/control.pub:ro" \
            "${{ matrix.os }}" bash -Eeuo pipefail -s <<'EOF'
          /bootstrap.sh --managed --hostname node-db1.test.local --pubkey-file /control.pub

          for pkg in openssh-server openssh-client python3 python3-apt sudo acl curl ca-certificates gnupg; do
            dpkg -s "$pkg" >/dev/null 2>&1 || { echo "Package missing: $pkg" >&2; exit 1; }
          done

          [[ "$(hostname)" == "node-db1.test.local" ]]
          grep -qE '^127\.0\.1\.1[[:space:]]+node-db1\.test\.local node-db1$' /etc/hosts

          [[ "$(stat -c '%a' /root/.ssh)" == "700" ]]
          [[ "$(stat -c '%a' /root/.ssh/authorized_keys)" == "600" ]]
          [[ "$(wc -l < /root/.ssh/authorized_keys)" -eq 1 ]]

          grep -qxF "PubkeyAuthentication yes" /etc/ssh/sshd_config.d/00-ansible-bootstrap.conf
          grep -qxF "PermitRootLogin prohibit-password" /etc/ssh/sshd_config.d/00-ansible-bootstrap.conf
          /usr/sbin/sshd -t
          /usr/sbin/sshd -T | grep -qi '^pubkeyauthentication yes$'
          /usr/sbin/sshd -T | grep -qi '^permitrootlogin prohibit-password$'

          /bootstrap.sh --managed --hostname node-db1.test.local --pubkey-file /control.pub
          [[ "$(wc -l < /root/.ssh/authorized_keys)" -eq 1 ]]

          if /bootstrap.sh --managed --pubkey-string "ssh-ed25519 INVALID_KEY_PAYLOAD" >/dev/null 2>&1; then
            echo "FAIL: pubkey invalid seharusnya ditolak" >&2; exit 1
          fi

          echo "Test A PASSED on $(. /etc/os-release && echo "$PRETTY_NAME")"
          EOF

      - name: Test B — Anti-Lockout (no pubkey) & Legacy sshd_config Include injection
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/$SCRIPT_PATH:/bootstrap.sh:ro" \
            "${{ matrix.os }}" bash -Eeuo pipefail -s <<'EOF'
          DEBIAN_FRONTEND=noninteractive apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends openssh-server
          sed -i '/Include \/etc\/ssh\/sshd_config\.d/d' /etc/ssh/sshd_config

          /bootstrap.sh --managed

          grep -qxF "PubkeyAuthentication yes" /etc/ssh/sshd_config.d/00-ansible-bootstrap.conf
          if grep -q "PermitRootLogin" /etc/ssh/sshd_config.d/00-ansible-bootstrap.conf; then
            echo "FAIL: PermitRootLogin seharusnya tidak ditulis saat tanpa pubkey" >&2; exit 1
          fi

          head -n1 /etc/ssh/sshd_config | grep -q "Include /etc/ssh/sshd_config.d/\*.conf"
          [[ -f /etc/ssh/sshd_config.bak-bootstrap ]]
          /usr/sbin/sshd -t

          echo "Test B PASSED"
          EOF

  # ===========================================================================
  # 5. End-to-End Multi-Container Test: Mode 2 (--control) + 5 Target Nodes
  # ===========================================================================
  e2e-control-cluster:
    name: 5. E2E Control Cluster (5 Nodes + SSH + Vault)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [unit-tests, integration-managed]
    steps:
      - uses: actions/checkout@v4

      - name: Build mock Ansible project zip & minimal target node image
        run: |
          set -euo pipefail
          chmod +x "$SCRIPT_PATH"

          mkdir -p /tmp/mock-zip/ansible-pg-dbaas-swarm-v3/inventory/group_vars
          cat > /tmp/mock-zip/ansible-pg-dbaas-swarm-v3/ansible.cfg <<'CFG'
          [defaults]
          host_key_checking = False
          stdout_callback = default
          CFG

          cat > /tmp/mock-zip/ansible-pg-dbaas-swarm-v3/inventory/group_vars/all.yml <<'YAML'
          ---
          ovpn_public_endpoint: "vpn.domain-lo.com"
          ovpn_port: 1194
          ovpn_proto: "udp"
          store_nodes:
            - code: "OLD01"
              name: "oldstore"
              swarm_host: "monitoring"
              http_port: 8069
              db_name: "odoo_old"

          # Marker komentar tetap dipertahankan
          baseline_flag: "kept"
          YAML

          cat > /tmp/mock-zip/ansible-pg-dbaas-swarm-v3/site.yml <<'YAML'
          ---
          - name: Verify Day-0 Bootstrapped Inventory & Variables
            hosts: all
            gather_facts: true
            tasks:
              - name: Verify global OpenVPN & Pola 1 store_nodes variables
                ansible.builtin.assert:
                  that:
                    - ovpn_public_endpoint == "vpn.e2e.internal"
                    - ovpn_port | int == 1195
                    - ovpn_proto == "udp"
                    - baseline_flag == "kept"
                    - store_nodes | length == 3
                    - store_nodes[0].code == "STR01"
                    - store_nodes[2].http_port | int == 8071

              - name: Verify primary DB flag only on db1
                when: "'db_nodes' in group_names"
                ansible.builtin.assert:
                  that:
                    - (inventory_hostname == 'db1' and is_primary | bool) or (inventory_hostname != 'db1' and not (is_primary | bool))
                    - repmgr_node_id | int >= 1
                    - vpn_ip is match('^10\.88\.0\.')

              - name: Verify vault secret if vault.yml exists
                when: vault_smoke_secret is defined
                ansible.builtin.assert:
                  that:
                    - vault_smoke_secret == "sovereign-e2e-ok"
          YAML

          chmod -R 777 /tmp/mock-zip/ansible-pg-dbaas-swarm-v3
          (cd /tmp/mock-zip && zip -rq /tmp/ansible-pg-dbaas-swarm-v3.zip ansible-pg-dbaas-swarm-v3)

          mkdir -p /tmp/target-img
          cat > /tmp/target-img/Dockerfile <<'DOCKER'
          FROM debian:12-slim
          RUN apt-get update -qq && \
              apt-get install -y -qq --no-install-recommends openssh-server && \
              rm -rf /var/lib/apt/lists/* && \
              mkdir -p /run/sshd && \
              echo 'root:Day0TempPass!' | chpasswd && \
              sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config && \
              sed -i 's/^#\?PasswordAuthentication.*/PasswordAuthentication yes/' /etc/ssh/sshd_config
          CMD ["/usr/sbin/sshd", "-D"]
          DOCKER
          docker build -q -t dbaas-minimal-target /tmp/target-img

      - name: Start isolated network, 5 target nodes & control node
        run: |
          set -euo pipefail
          docker network create --subnet=172.28.0.0/24 dbaas-e2e-net

          declare -A NODES=(
            [backup]=172.28.0.10
            [db1]=172.28.0.11
            [db2]=172.28.0.12
            [db3]=172.28.0.13
            [monitoring]=172.28.0.20
          )
          for n in "${!NODES[@]}"; do
            docker run -d --name "e2e-$n" --hostname "$n" \
              --network dbaas-e2e-net --ip "${NODES[$n]}" \
              --cap-add=SYS_ADMIN \
              dbaas-minimal-target
          done

          docker cp "$SCRIPT_PATH" e2e-db1:/bootstrap.sh
          docker exec e2e-db1 /bootstrap.sh --managed --hostname node-db1

          docker run -d --name e2e-control --hostname control-node \
            --network dbaas-e2e-net --ip 172.28.0.5 \
            -v "$PWD/$SCRIPT_PATH:/opt/bootstrap-1st-install.sh:ro" \
            -v "/tmp/ansible-pg-dbaas-swarm-v3.zip:/opt/ansible-pg-dbaas-swarm-v3.zip:ro" \
            debian:12 sleep infinity

      - name: Execute Stage [1/6]..[6/6] + Ping + Auto-Deploy + Encrypted Vault Re-Run
        run: |
          set -euo pipefail

          docker exec -i e2e-control bash -Eeuo pipefail -s <<'EOF'
          export OVPN_PUBLIC_ENDPOINT="vpn.e2e.internal"
          export OVPN_PORT="1195"
          export OVPN_PROTO="udp"
          export BACKUP_SSH_IP="172.28.0.10" BACKUP_VPN_IP="10.88.0.1"
          export MON_SSH_IP="172.28.0.20"    MON_VPN_IP="10.88.0.20"
          export DB_HOSTS="1:db1:172.28.0.11:10.88.0.11:manager:100:yes,2:db2:172.28.0.12:10.88.0.12:manager:90:yes,3:db3:172.28.0.13:10.88.0.13:worker:0:no"
          export STORE_LIST_SPEC="STR01:store1:monitoring:8069:odoo_store1,STR02:store2:monitoring:8070:odoo_store2,STR03:store3:monitoring:8071:odoo_store3"
          export SSH_PASS="Day0TempPass!"

          /opt/bootstrap-1st-install.sh --control \
            --zip /opt/ansible-pg-dbaas-swarm-v3.zip \
            --work-dir /opt/ansible-pg-dbaas-swarm-v3 \
            --auto-deploy

          test -x /usr/local/bin/ansible
          test -f /root/.ssh/id_ed25519
          test -f /root/.ssh/id_ed25519.pub
          test -f /opt/ansible-pg-dbaas-swarm-v3/inventory/hosts.yml
          test -f /opt/ansible-pg-dbaas-swarm-v3/.bootstrap-backup/all.yml.orig
          [[ -z "$(find /opt/ansible-pg-dbaas-swarm-v3 -perm -0002)" ]]

          for col in community.docker community.general ansible.posix; do
            ansible-galaxy collection list | grep -q "$col"
          done

          unset SSH_PASS
          printf 'ci-vault-secret-pass\n' > /root/.vault_pass
          chmod 600 /root/.vault_pass

          cat > /opt/ansible-pg-dbaas-swarm-v3/inventory/group_vars/vault.yml <<'YAML'
          ---
          vault_smoke_secret: "sovereign-e2e-ok"
          YAML
          ansible-vault encrypt --vault-password-file /root/.vault_pass \
            /opt/ansible-pg-dbaas-swarm-v3/inventory/group_vars/vault.yml

          ANSIBLE_VAULT_PASSWORD_FILE=/root/.vault_pass \
            /opt/bootstrap-1st-install.sh --control \
            --work-dir /opt/ansible-pg-dbaas-swarm-v3 \
            --skip-ssh-bootstrap \
            --auto-deploy

          [[ "$(grep -c '^store_nodes:' /opt/ansible-pg-dbaas-swarm-v3/inventory/group_vars/all.yml)" -eq 1 ]]
          echo "E2E Control + 5 Nodes + Vault PASSED!"
          EOF

      - name: Verify REMOTE_PREP installed Python3 & ACL on barebones targets
        run: |
          set -euo pipefail
          for n in backup db2 db3 monitoring; do
            docker exec "e2e-$n" bash -c 'command -v python3 && dpkg -s python3-apt acl sudo >/dev/null'
            echo "Verified REMOTE_PREP packages on e2e-$n"
          done

      - name: Cleanup Docker containers & network
        if: always()
        run: |
          docker rm -f e2e-control e2e-backup e2e-db1 e2e-db2 e2e-db3 e2e-monitoring 2>/dev/null || true
          docker network rm dbaas-e2e-net 2>/dev/null || true

  # ===========================================================================
  # 6. E2E Playbook Syntax + Custom Odoo Retail Store POS -> Native DBaaS Cluster
  #    (db1 Primary -> db2 Streaming Standby, TANPA container postgres tambahan)
  # ===========================================================================
  e2e-odoo-retail-pos:
    name: 6. E2E Real Zip Syntax + Odoo retail_store_pos -> DBaaS (db1 + db2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [unit-tests, dry-run]
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible & collections in isolated venv
        run: |
          set -euo pipefail
          python3 -m venv /tmp/odoo-ansible-venv
          /tmp/odoo-ansible-venv/bin/pip install --quiet --upgrade pip
          /tmp/odoo-ansible-venv/bin/pip install --quiet "ansible-core>=2.15" pyyaml
          /tmp/odoo-ansible-venv/bin/ansible-galaxy collection install community.docker community.general ansible.posix

      - name: Build native PostgreSQL 16 DB node image (simulasi VM db1 & db2)
        run: |
          set -euo pipefail
          mkdir -p /tmp/dbnode-img
          cat > /tmp/dbnode-img/Dockerfile <<'DOCKER'
          FROM ubuntu:24.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update -qq && \
              apt-get install -y -qq --no-install-recommends \
                openssh-server python3 python3-apt sudo acl postgresql-16 postgresql-client-16 && \
              rm -rf /var/lib/apt/lists/* && \
              mkdir -p /run/sshd && \
              sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin prohibit-password/' /etc/ssh/sshd_config
          CMD ["/usr/sbin/sshd", "-D"]
          DOCKER
          docker build -q -t dbaas-pg16-node /tmp/dbnode-img

      - name: Start cluster network, db1/db2, unpack real zip & syntax-check all playbooks
        shell: bash
        run: |
          set -Eeuo pipefail
          docker network create --subnet=172.29.0.0/24 dbaas-pos-net
          ssh-keygen -q -t ed25519 -N "" -f /tmp/pos_ci_ed25519

          for spec in "db1:172.29.0.11" "db2:172.29.0.12"; do
            IFS=':' read -r name ip <<< "$spec"
            docker run -d --name "pos-${name}" --hostname "$name" \
              --network dbaas-pos-net --ip "$ip" \
              dbaas-pg16-node
            docker exec "pos-${name}" bash -c 'install -d -m 700 /root/.ssh'
            docker cp /tmp/pos_ci_ed25519.pub "pos-${name}:/root/.ssh/authorized_keys"
            docker exec "pos-${name}" chmod 600 /root/.ssh/authorized_keys
          done

          export WORK_DIR=/tmp/odoo-e2e-work
          export ANSIBLE_ZIP="$ZIP_PATH"
          export SSH_KEY_PATH=/tmp/pos_ci_ed25519
          export OVPN_PUBLIC_ENDPOINT="vpn.odoo-e2e.internal"
          export OVPN_PORT="1194"
          export OVPN_PROTO="udp"
          export BACKUP_SSH_IP="172.29.0.10" BACKUP_VPN_IP="10.88.0.1"
          export MON_SSH_IP="172.29.0.20"    MON_VPN_IP="10.88.0.20"
          export DB_HOSTS="1:db1:172.29.0.11:10.88.0.11:manager:100:yes,2:db2:172.29.0.12:10.88.0.12:manager:90:yes"
          export STORE_LIST_SPEC="STR01:store1:monitoring:8069:odoo_store1,STR02:store2:monitoring:8070:odoo_store2:odoo_u2,STR03:store3:monitoring:8071:odoo_store3"

          # shellcheck disable=SC1090
          source "$SCRIPT_PATH"
          parse_cluster_specs
          validate_control_config
          check_placeholders
          PATH="/tmp/odoo-ansible-venv/bin:$PATH" unpack_ansible_project
          generate_inventory_and_vars

          # Syntax-check seluruh playbook di dalam ansible-pg-dbaas-swarm-v3.zip
          for pb in site.yml add_store.yml promote.yml status.yml; do
            if [[ -f "$WORK_DIR/$pb" ]]; then
              echo "=== Syntax-check: $pb ==="
              (cd "$WORK_DIR" && /tmp/odoo-ansible-venv/bin/ansible-playbook -i inventory/hosts.yml "$pb" --syntax-check)
            fi
          done

          # Uji ping Ansible ke db_nodes memakai inventory hasil bootstrap
          ANSIBLE_HOST_KEY_CHECKING=False \
            /tmp/odoo-ansible-venv/bin/ansible -i "$WORK_DIR/inventory/hosts.yml" db_nodes -m ping

      - name: Provision PostgreSQL Primary (db1) -> Streaming Standby (db2) & Pola 1 Store DBs
        run: |
          set -euo pipefail

          cat > /tmp/odoo-e2e-work/provision-dbaas-cluster.yml <<'YAML'
          ---
          - name: Configure Native PostgreSQL 16 Primary on db1 (is_primary=true)
            hosts: db_nodes
            gather_facts: false
            vars:
              pg_rep_pass: "RepmgrSecretCI!"
            tasks:
              - name: Configure postgresql.conf & pg_hba.conf on primary (db1)
                when: is_primary | bool
                ansible.builtin.shell: |
                  set -euo pipefail
                  cat >> /etc/postgresql/16/main/postgresql.conf <<'CONF'
                  listen_addresses = '*'
                  wal_level = replica
                  max_wal_senders = 10
                  hot_standby = on
                  CONF
                  cat >> /etc/postgresql/16/main/pg_hba.conf <<'HBA'
                  host all         all    172.29.0.0/24 scram-sha-256
                  host replication repmgr 172.29.0.0/24 scram-sha-256
                  HBA
                  pg_ctlcluster 16 main restart
                  for _ in $(seq 1 20); do pg_isready -q && break; sleep 1; done
                  pg_isready -q
                  runuser -u postgres -- psql -v ON_ERROR_STOP=1 -c \
                    "CREATE ROLE repmgr WITH REPLICATION LOGIN PASSWORD '{{ pg_rep_pass }}';"
                args:
                  executable: /bin/bash

              - name: Provision isolated Pola 1 store roles & databases on primary (db1)
                when: is_primary | bool
                ansible.builtin.shell: |
                  set -euo pipefail
                  db_user="{{ item.db_user }}"
                  db_name="{{ item.db_name }}"
                  db_pass="OdooPass_{{ item.code }}!"

                  runuser -u postgres -- psql -v ON_ERROR_STOP=1 <<SQL
                  CREATE ROLE "${db_user}" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD '${db_pass}';
                  CREATE DATABASE "${db_name}" OWNER "${db_user}" ENCODING 'UTF8';
                  SQL

                  runuser -u postgres -- psql -v ON_ERROR_STOP=1 -d "${db_name}" <<SQL
                  REVOKE ALL ON DATABASE "${db_name}" FROM PUBLIC;
                  GRANT ALL ON DATABASE "${db_name}" TO "${db_user}";
                  ALTER SCHEMA public OWNER TO "${db_user}";
                  REVOKE ALL ON SCHEMA public FROM PUBLIC;
                  GRANT ALL ON SCHEMA public TO "${db_user}";
                  SQL
                args:
                  executable: /bin/bash
                loop: "{{ store_nodes }}"
                loop_control:
                  label: "{{ item.code }} -> {{ item.db_name }} on {{ inventory_hostname }}"

          - name: Join db2 as Streaming Hot Standby replicating from db1
            hosts: db_nodes
            gather_facts: false
            vars:
              pg_rep_pass: "RepmgrSecretCI!"
              primary_ip: "{{ hostvars['db1'].ansible_host }}"
            tasks:
              - name: Basebackup from db1 and start hot standby on db2
                when: not (is_primary | bool)
                ansible.builtin.shell: |
                  set -euo pipefail
                  pg_ctlcluster 16 main stop --force || true
                  find /var/lib/postgresql/16/main -mindepth 1 -delete
                  runuser -u postgres -- env PGPASSWORD='{{ pg_rep_pass }}' \
                    pg_basebackup -h "{{ primary_ip }}" -D /var/lib/postgresql/16/main -U repmgr -Fp -Xs -R
                  pg_ctlcluster 16 main start
                  for _ in $(seq 1 20); do pg_isready -q && break; sleep 1; done
                  rec=$(runuser -u postgres -- psql -tAc 'SELECT pg_is_in_recovery();')
                  test "$rec" = "t"
                args:
                  executable: /bin/bash
          YAML

          ANSIBLE_HOST_KEY_CHECKING=False \
            /tmp/odoo-ansible-venv/bin/ansible-playbook \
              -i /tmp/odoo-e2e-work/inventory/hosts.yml \
              /tmp/odoo-e2e-work/provision-dbaas-cluster.yml

      - name: Build custom Odoo Retail Store POS image directly from ansible-pg-dbaas-swarm-v3.zip
        run: |
          set -euo pipefail
          ODOO_CTX=/tmp/odoo-build-ctx
          rm -rf "$ODOO_CTX"
          cp -a /tmp/odoo-e2e-work/roles/dbaas_stack/files/odoo "$ODOO_CTX"
          sed 's/{{ odoo_version }}/17.0/g' \
            /tmp/odoo-e2e-work/roles/dbaas_stack/templates/Dockerfile.odoo.j2 \
            > "$ODOO_CTX/Dockerfile"

          docker build -q -t pg-dbaas-v3-odoo-retail:17.0 "$ODOO_CTX"
          echo "PASS: Custom image pg-dbaas-v3-odoo-retail:17.0 (with retail_store_pos addon) built!"

      - name: Run 3 custom Odoo Retail POS containers -> db1 & verify addon, POS checkout, replication & isolation
        run: |
          set -euo pipefail
          PRIMARY_DB_IP="172.29.0.11"
          mkdir -p /tmp/odoo-secrets
          printf 'OdooMasterCI!' > /tmp/odoo-secrets/odoo_master_pass

          # Jalankan 3 container custom pg-dbaas-v3-odoo-retail:17.0 (entrypoint-odoo.sh auto-init retail_store_pos)
          for spec in "STR01:store1:8069:odoo_store1:odoo_store1" \
                      "STR02:store2:8070:odoo_store2:odoo_u2" \
                      "STR03:store3:8071:odoo_store3:odoo_store3"; do
            IFS=':' read -r code sname port dbname dbuser <<< "$spec"
            printf 'OdooPass_%s!' "$code" > "/tmp/odoo-secrets/odoo_db_pass_${sname}"
            docker run -d --name "odoo-${sname}" \
              --network dbaas-pos-net \
              -p "${port}:8069" \
              -v "/tmp/odoo-secrets/odoo_master_pass:/run/secrets/odoo_master_pass:ro" \
              -v "/tmp/odoo-secrets/odoo_db_pass_${sname}:/run/secrets/odoo_db_pass:ro" \
              -e STORE_CODE="$code" \
              -e STORE_NAME="$sname" \
              -e ODOO_DB_HOST="$PRIMARY_DB_IP" \
              -e ODOO_DB_PORT=5432 \
              -e ODOO_DB_NAME="$dbname" \
              -e ODOO_DB_USER="$dbuser" \
              -e ODOO_AUTO_INIT=1 \
              -e ODOO_WORKERS=0 \
              pg-dbaas-v3-odoo-retail:17.0
          done

          # Script verifikasi custom addon retail_store_pos + transaksi kasir POS
          cat > /tmp/pos_e2e_tx.py <<'PY'
          import os
          from odoo import api

          code = os.environ["STORE_CODE"]
          sname = os.environ["STORE_NAME"]
          admin = env.ref("base.user_admin")
          uenv = api.Environment(env.cr, admin.id, dict(env.context))
          company = uenv.company

          # 1. Pastikan modul point_of_sale & custom addon retail_store_pos terpasang
          for mod_name in ("point_of_sale", "retail_store_pos"):
              mod = uenv["ir.module.module"].search([("name", "=", mod_name)], limit=1)
              assert mod and mod.state == "installed", f"Modul {mod_name} belum installed: {mod.state if mod else 'missing'}"

          # 2. Pastikan retail.store.branch sudah otomatis di-seed oleh entrypoint-odoo.sh
          branch = uenv["retail.store.branch"].search([("code", "=", code)], limit=1)
          assert branch, f"retail.store.branch code={code} tidak ditemukan!"

          # 3. Load CoA & siapkan POS Register tertaut ke retail_branch_id
          if not uenv["account.journal"].search([("type", "=", "sale"), ("company_id", "=", company.id)], limit=1):
              uenv["account.chart.template"].try_loading("generic_coa", company=company, install_demo=False)

          sale_j = uenv["account.journal"].search([("type", "=", "sale"), ("company_id", "=", company.id)], limit=1)
          cash_j = uenv["account.journal"].search([("type", "=", "cash"), ("company_id", "=", company.id)], limit=1)
          assert sale_j and cash_j, "Jurnal Sale/Cash tidak tersedia"

          pm = uenv["pos.payment.method"].search(
              [("journal_id", "=", cash_j.id), ("company_id", "=", company.id)], limit=1
          ) or uenv["pos.payment.method"].create({
              "name": f"Cash {code}",
              "journal_id": cash_j.id,
              "company_id": company.id,
          })

          cfg = uenv["pos.config"].search([("company_id", "=", company.id)], limit=1)
          vals = {
              "name": f"POS Retail {code} ({sname})",
              "journal_id": sale_j.id,
              "payment_method_ids": [(4, pm.id)],
              "retail_branch_id": branch.id,
          }
          if cfg:
              cfg.write(vals)
          else:
              cfg = uenv["pos.config"].create(vals)
          assert cfg.retail_branch_code == code, f"retail_branch_code mismatch: {cfg.retail_branch_code}"

          # 4. Produk retail + buka session + checkout paid order
          prod = uenv["product.product"].create({
              "name": f"Kopi Hitam Retail {code}",
              "default_code": f"SKU-{code}-001",
              "available_in_pos": True,
              "detailed_type": "consu",
              "list_price": 25000.0,
          })

          cfg.open_ui()
          sess = cfg.current_session_id
          assert sess, "Gagal membuka pos.session"
          if sess.state == "opening_control":
              sess.action_pos_session_open()
          assert sess.state == "opened"

          pricelist = (
              cfg.pricelist_id
              or uenv["product.pricelist"].search([("company_id", "in", [company.id, False])], limit=1)
              or uenv["product.pricelist"].create({"name": f"PL {code}", "currency_id": company.currency_id.id})
          )

          order = uenv["pos.order"].create({
              "session_id": sess.id,
              "company_id": company.id,
              "pricelist_id": pricelist.id,
              "pos_reference": f"POS-{code}-0001",
              "amount_tax": 0.0,
              "amount_total": 50000.0,
              "amount_paid": 50000.0,
              "amount_return": 0.0,
              "lines": [(0, 0, {
                  "product_id": prod.id,
                  "full_product_name": prod.name,
                  "qty": 2.0,
                  "price_unit": 25000.0,
                  "price_subtotal": 50000.0,
                  "price_subtotal_incl": 50000.0,
                  "tax_ids_after_fiscal_position": [(6, 0, [])],
              })],
          })
          order.add_payment({
              "pos_order_id": order.id,
              "payment_method_id": pm.id,
              "amount": 50000.0,
          })
          order.action_pos_order_paid()
          assert order.state == "paid"

          # 5. Verifikasi compute metric custom model retail.store.branch
          branch.invalidate_recordset()
          assert branch.pos_count >= 1, f"pos_count tidak bertambah: {branch.pos_count}"
          assert branch.today_sales_total >= 50000.0, f"today_sales_total salah: {branch.today_sales_total}"

          uenv.cr.commit()
          print(f"CI_POS_CONFIG_ID={cfg.id}")
          print(f"CI_BRANCH_SALES={branch.today_sales_total}")
          print("CI_POS_TX_OK=1")
          PY

          for spec in "store1:8069:odoo_store1:odoo_store1:STR01" \
                      "store2:8070:odoo_store2:odoo_u2:STR02" \
                      "store3:8071:odoo_store3:odoo_store3:STR03"; do
            IFS=':' read -r sname port dbname dbuser code <<< "$spec"
            echo "=== Menunggu auto-init entrypoint-odoo.sh (${code}/${sname} di :${port}) ==="

            ready=0
            for _ in $(seq 1 120); do
              health=$(curl -fsS --max-time 5 "http://127.0.0.1:${port}/web/health" 2>/dev/null || true)
              code_login=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 10 "http://127.0.0.1:${port}/web/login" 2>/dev/null || true)
              if echo "$health" | grep -q '"pass"' && [[ "$code_login" == "200" ]]; then
                ready=1; break
              fi
              sleep 3
            done
            (( ready )) || { echo "FAIL: odoo-${sname} tidak ready" >&2; docker logs --tail 80 "odoo-${sname}"; exit 1; }

            # Eksekusi verifikasi retail_store_pos & transaksi POS menggunakan /tmp/odoo.conf asli container
            docker exec -i -e STORE_CODE="$code" -e STORE_NAME="$sname" "odoo-${sname}" \
              runuser -u odoo -- odoo shell -c /tmp/odoo.conf -d "$dbname" --no-http --log-level=warn \
              < /tmp/pos_e2e_tx.py > "/tmp/tx_${sname}.log" 2>&1

            grep -qx "CI_POS_TX_OK=1" "/tmp/tx_${sname}.log" || { cat "/tmp/tx_${sname}.log" >&2; exit 1; }
            cfg_id=$(sed -n 's/^CI_POS_CONFIG_ID=//p' "/tmp/tx_${sname}.log" | tail -n1)
            sales=$(sed -n 's/^CI_BRANCH_SALES=//p' "/tmp/tx_${sname}.log" | tail -n1)

            # Verifikasi login JSON-RPC & /pos/ui
            auth_resp=$(curl -fsS -c "/tmp/cookie_${sname}.txt" \
              -H 'Content-Type: application/json' \
              -d "{\"jsonrpc\":\"2.0\",\"method\":\"call\",\"params\":{\"db\":\"${dbname}\",\"login\":\"admin\",\"password\":\"admin\"}}" \
              "http://127.0.0.1:${port}/web/session/authenticate")
            echo "$auth_resp" | grep -qE '"uid":[[:space:]]*[0-9]+'

            pos_ui_code=$(curl -sS -L -b "/tmp/cookie_${sname}.txt" \
              -o "/tmp/pos_ui_${sname}.html" -w '%{http_code}' \
              "http://127.0.0.1:${port}/pos/ui?config_id=${cfg_id}")
            [[ "$pos_ui_code" == "200" ]]
            grep -qi 'point_of_sale\|pos\.assets' "/tmp/pos_ui_${sname}.html"

            # Verifikasi data retail_store_branch & pos_order ada di db1 SEKALIGUS tereplikasi ke db2
            cnt_db1=$(docker exec pos-db1 runuser -u postgres -- \
              psql -d "$dbname" -tAc "SELECT (SELECT count(*) FROM retail_store_branch WHERE code='${code}') + (SELECT count(*) FROM pos_order WHERE pos_reference='POS-${code}-0001' AND state='paid');")

            cnt_db2="0"
            for _ in $(seq 1 15); do
              cnt_db2=$(docker exec pos-db2 runuser -u postgres -- \
                psql -d "$dbname" -tAc "SELECT (SELECT count(*) FROM retail_store_branch WHERE code='${code}') + (SELECT count(*) FROM pos_order WHERE pos_reference='POS-${code}-0001' AND state='paid');" || echo "0")
              [[ "$cnt_db2" == "2" ]] && break
              sleep 1
            done

            [[ "$cnt_db1" == "2" && "$cnt_db2" == "2" ]] || {
              echo "FAIL: Replikasi POS/Branch ${code} tidak sinkron (db1=${cnt_db1}, db2=${cnt_db2})" >&2
              exit 1
            }
            echo "PASS: ${code} (:${port}) -> retail_store_pos OK, today_sales=${sales}, /pos/ui=200, db1=2 & db2=2!"
          done

          # Verifikasi isolasi Pola 1 (DB Role + Data Transaksi POS) di db1 & db2
          if docker exec -e PGPASSWORD="OdooPass_STR01!" pos-db1 \
               psql -h 127.0.0.1 -U odoo_store1 -d odoo_store2 -c "SELECT 1;" >/dev/null 2>&1; then
            echo "FAIL: Pelanggaran isolasi DB! odoo_store1 bisa mengakses odoo_store2!" >&2
            exit 1
          fi

          for dbname in odoo_store2 odoo_store3; do
            leak=$(docker exec pos-db2 runuser -u postgres -- \
              psql -d "$dbname" -tAc "SELECT count(*) FROM pos_order WHERE pos_reference='POS-STR01-0001';")
            [[ "$leak" == "0" ]] || {
              echo "FAIL: Kebocoran data POS STR01 di ${dbname} pada standby db2!" >&2
              exit 1
            }
          done
          echo "PASS: Custom retail_store_pos + Isolasi Pola 1 + Replikasi db1 -> db2 TERVERIFIKASI!"

      - name: Dump logs on failure
        if: failure()
        run: |
          docker ps -a || true
          for c in odoo-store1 odoo-store2 odoo-store3; do
            echo "===== CONTAINER LOGS: $c ====="
            docker logs --tail 80 "$c" 2>&1 || true
          done
          for f in /tmp/tx_*.log; do
            if [[ -f "$f" ]]; then
              echo "===== FILE: $f ====="
              tail -n 60 "$f"
            fi
          done

      - name: Cleanup POS E2E containers & network
        if: always()
        run: |
          docker rm -f pos-db1 pos-db2 odoo-store1 odoo-store2 odoo-store3 2>/dev/null || true
          docker network rm dbaas-pos-net 2>/dev/null || true
